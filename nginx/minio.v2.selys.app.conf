upstream minio_s3 {
    server 127.0.0.1:9005;
}

upstream minio_console {
    server 127.0.0.1:9006;
}

server {
    listen 80;
    server_name s3.v2.selys.app minio.v2.selys.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# S3 API
server {
    listen 443 ssl http2;
    server_name s3.v2.selys.app;

    ssl_certificate /etc/letsencrypt/live/minio.v2.selys.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minio.v2.selys.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_MINIO:10m;
    ssl_session_timeout 10m;

    client_max_body_size 0;
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        proxy_pass http://minio_s3;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        chunked_transfer_encoding off;
    }
}

# Console
server {
    listen 443 ssl http2;
    server_name minio.v2.selys.app;

    ssl_certificate /etc/letsencrypt/live/minio.v2.selys.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minio.v2.selys.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_MINIO:10m;
    ssl_session_timeout 10m;

    client_max_body_size 0;
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        proxy_pass http://minio_console;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
